<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Splatoon Lamp Overlay</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background-color: transparent !important; overflow: hidden; }

/* ランプ専用コンテナ */
.lamp-container {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  transform: skewX(-8deg);
}

.lamps-block { display: flex; flex-direction: column; gap: 15px; align-items: center; justify-content: center; }
.lamp-group { display: flex; gap: 20px; align-items: center; justify-content: center; }

/* 〇 勝ちランプ（直径 140px） */
.lamp-win {
  width: 140px; height: 140px; border-radius: 50%;
  border: 8px solid #1a1a1a; background: rgba(0, 0, 0, 0.8);
  display: flex; align-items: center; justify-content: center;
  font-size: 90px; font-weight: 900; line-height: 1; font-family: sans-serif;
  box-shadow: 0 8px 20px rgba(0,0,0,0.9), inset 0 5px 12px rgba(0,0,0,0.95);
  transition: all 0.2s ease-in-out; color: transparent;
}
.lamp-win.active {
  border-color: #00ff66; color: #00ff66; background: rgba(0, 70, 30, 0.95);
  box-shadow: 0 0 35px #00ff66, 0 0 70px rgba(0,255,102,0.6), inset 0 0 22px #00ff66;
  text-shadow: 0 0 22px #00ff66;
}

/* ✖ 負けランプ（直径 90px） */
.lamp-loss {
  width: 90px; height: 90px; border-radius: 50%;
  border: 6px solid #1a1a1a;
  display: flex; align-items: center; justify-content: center;
  font-size: 55px; font-weight: 900; line-height: 1; font-family: sans-serif;
  transition: all 0.2s ease-in-out;
}
.lamp-loss.on {
  border-color: #ff9900; background: #ff9900;
  box-shadow: 0 0 25px #ff9900, 0 0 50px rgba(255, 153, 0, 0.6), inset 0 0 12px #ffffff;
  color: transparent;
}
.lamp-loss.off {
  border-color: #ff3366; color: #ff3366; background: rgba(50, 0, 15, 0.9);
  box-shadow: 0 0 18px rgba(255,51,102,0.4), inset 0 0 8px rgba(0,0,0,0.8);
  text-shadow: 0 0 12px #ff3366;
}
</style>
</head>
<body>
<div class="lamp-container">
  <div class="lamps-block">
    <div class="lamp-group">
      <div class="lamp-win" id="winLamp0"></div>
      <div class="lamp-win" id="winLamp1"></div>
      <div class="lamp-win" id="winLamp2"></div>
    </div>
    <div class="lamp-group">
      <div class="lamp-loss on" id="lossLamp0"></div>
      <div class="lamp-loss on" id="lossLamp1"></div>
      <div class="lamp-loss on" id="lossLamp2"></div>
    </div>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get('id') || 'default';
const storageKey = `splat_xp_data_${roomId}`;
const channelName = `splat_xp_bc_${roomId}`;

function applyState(data) {
  if (!data) return;

  const winCount = data.winLamps || 0;
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById(`winLamp${i}`);
    if (i < winCount) {
      el.className = 'lamp-win active';
      el.innerText = '〇';
    } else {
      el.className = 'lamp-win';
      el.innerText = '';
    }
  }

  const lossCount = data.lossLamps || 0;
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById(`lossLamp${i}`);
    if (i < lossCount) {
      el.className = 'lamp-loss off';
      el.innerText = '✖';
    } else {
      el.className = 'lamp-loss on';
      el.innerText = '';
    }
  }
}

function loadState() {
  const saved = localStorage.getItem(storageKey);
  if (saved) {
    try { applyState(JSON.parse(saved)); } catch(e){}
  }
}

loadState();

try {
  const bc = new BroadcastChannel(channelName);
  bc.onmessage = (e) => applyState(e.data);
} catch(e){}

window.addEventListener('storage', (e) => {
  if (e.key === storageKey && e.newValue) {
    try { applyState(JSON.parse(e.newValue)); } catch(err){}
  }
});

setInterval(loadState, 1000);
</script>
</body>
</html>
